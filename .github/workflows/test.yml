name: CI Test, Sync to Hugging Face, Notify
 
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
 
jobs:
  #Runs on every push AND every pull request. Nothing downstream happens unless this job succeeds.
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
 
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
 
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
 
      - name: Run pytest
        run: pytest -v
 
  #`needs: test` makes this job wait for the test job and only run if it succeeded...if pytest fails, this job is automatically SKIPPED
  #A broken app.py is never forwarded to Hugging Face and restricts pushes on main (not pull requests), so PR branches never get synced.
  sync-to-huggingface:
    name: Sync to Hugging Face Spaces
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
 
      - uses: huggingface/hub-sync@v0.1.0
        with:
          github_repo_id: ${{ github.repository }}
          huggingface_repo_id: agalbraith221/StockSuggestor_CS1
          hf_token: ${{ secrets.HF_TOKEN }}
 
  #Runs after both jobs above, regardless of whether they passed, failed, or were skipped (`if: always()`) and reports what happened.
  notify:
    name: Notify Slack
    needs: [test, sync-to-huggingface]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Build status message
        id: msg
        run: |
          TEST_RESULT="${{ needs.test.result }}"
          SYNC_RESULT="${{ needs.sync-to-huggingface.result }}"
          TEXT="Stock Suggestor CI on \`${GITHUB_REF_NAME}\` (commit ${GITHUB_SHA:0:7}): tests **${TEST_RESULT}**, HF sync **${SYNC_RESULT}**. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          echo "text=${TEXT}" >> "$GITHUB_OUTPUT"
 
      - name: Notify Slack
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          MSG: ${{ steps.msg.outputs.text }}
        run: |
          if [ -n "$SLACK_WEBHOOK_URL" ]; then
            curl -X POST -H "Content-type: application/json" \
                 --data "{\"text\": \"${MSG}\"}" \
                 "$SLACK_WEBHOOK_URL"
          else
            echo "SLACK_WEBHOOK_URL secret not set — skipping Slack notification."
          fi
